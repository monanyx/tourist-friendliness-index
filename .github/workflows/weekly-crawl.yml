name: Weekly crawl

# Re-crawls every venue website each Monday and commits the raw evidence,
# so any change on a venue's site shows up as a diff in data/raw/.
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/audit.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw/auto_audit.json
          git diff --cached --quiet || git commit -m "Weekly crawl $(date -u +%F)"
          git push
